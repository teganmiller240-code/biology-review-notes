<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drive Mix</title>
<style>
    :root {
        --bg-main: #121212;
        --bg-sidebar: #000000;
        --bg-dock: #181818;
        --accent: #1db954;
        --text-main: #ffffff;
        --text-dim: #b3b3b3;
        --hover-bg: #2a2a2a;
    }
    body, html {
        margin: 0; padding: 0; height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg-main); color: var(--text-main);
        display: flex; flex-direction: column; overflow: hidden;
    }
    .app-container {
        display: flex; flex: 1; height: calc(100vh - 90px);
    }
    .sidebar {
        width: 240px; background-color: var(--bg-sidebar); padding: 24px;
        display: flex; flex-direction: column; box-sizing: border-box;
    }
    .sidebar h2 { font-size: 14px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
    .sidebar-menu { list-style: none; padding: 0; margin-top: 15px; }
    .sidebar-menu li { margin-bottom: 12px; font-weight: bold; cursor: default; }
    
    .main-view {
        flex: 1; background: linear-gradient(to bottom, #2b2b2b, var(--bg-main) 30%);
        padding: 32px; overflow-y: auto; box-sizing: border-box;
    }
    .playlist-header { font-size: 48px; font-weight: 900; margin: 0 0 24px 0; }
    .track-list { width: 100%; border-collapse: collapse; }
    .track-list th { text-align: left; color: var(--text-dim); font-size: 12px; padding-bottom: 10px; border-bottom: 1px solid #333; font-weight: normal; }
    .track-row { cursor: pointer; transition: background-color 0.2s ease; border-radius: 4px; }
    .track-row:hover { background-color: var(--hover-bg); }
    .track-row td { padding: 12px 10px; border-radius: 4px; }
    .track-title-cell { font-weight: 500; }
    .playing-text { color: var(--accent); }
    
    .player-dock {
        position: fixed; bottom: 0; left: 0; right: 0; height: 90px;
        background-color: var(--bg-dock); border-top: 1px solid #282828;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 20px; z-index: 100; box-sizing: border-box;
    }
    .now-playing { width: 30%; display: flex; flex-direction: column; }
    .now-playing-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .now-playing-status { font-size: 12px; color: var(--text-dim); }
    .controls { width: 40%; display: flex; justify-content: center; align-items: center; gap: 20px; }
    .volume-spacer { width: 30%; }
    
    button {
        background: transparent; border: none; color: var(--text-main); font-weight: bold;
        font-size: 16px; cursor: pointer; transition: transform 0.1s, color 0.2s;
    }
    button:hover { color: var(--accent); transform: scale(1.05); }
    .btn-main { background-color: var(--text-main); color: #000; padding: 8px 24px; border-radius: 30px; }
    .btn-main:hover { background-color: var(--accent); color: #000; }
</style>
</head>
<body>

<div class="app-container">
    <div class="sidebar">
        <h2>Library</h2>
        <ul class="sidebar-menu">
            <li>My spotDL Tracks</li>
        </ul>
    </div>
    
    <div class="main-view">
        <h1 class="playlist-header">Drive Mix</h1>
        <table class="track-list">
            <thead>
                <tr>
                    <th>#</th>
                    <th>TITLE</th>
                </tr>
            </thead>
            <tbody id="track-tbody"></tbody>
        </table>
    </div>
</div>

<div class="player-dock">
    <div class="now-playing">
        <div class="now-playing-title" id="dock-title">Select a track</div>
        <div class="now-playing-status" id="dock-status">Ready</div>
    </div>
    <div class="controls">
        <button id="btn-shuffle">Shuf</button>
        <button id="btn-prev">Prev</button>
        <button id="btn-play" class="btn-main">Play</button>
        <button id="btn-next">Next</button>
    </div>
    <div class="volume-spacer"></div>
</div>

<script>

    const audioPlayer = new Audio();
    audioPlayer.preload = "none";

    let currentIndex = -1;
    let isShuffle = false;

    const trackTbody = document.getElementById("track-tbody");
    const dockTitle = document.getElementById("dock-title");
    const dockStatus = document.getElementById("dock-status");
    const btnPlay = document.getElementById("btn-play");
    const btnPrev = document.getElementById("btn-prev");
    const btnNext = document.getElementById("btn-next");
    const btnShuffle = document.getElementById("btn-shuffle");

    const mediaErrorMessages = {
        1: "Loading was aborted.",
        2: "A network error occurred while fetching the audio.",
        3: "The file loaded but could not be decoded.",
        4: "The audio URL is missing, inaccessible, or in an unsupported format."
    };

    function showPlaybackError(error) {
        const mediaError = audioPlayer.error;
        let message;

        if (mediaError) {
            message = mediaErrorMessages[mediaError.code] || `Media error ${mediaError.code}.`;
            console.error("HTML audio error", {
                code: mediaError.code,
                message,
                src: audioPlayer.currentSrc || audioPlayer.src,
                networkState: audioPlayer.networkState,
                readyState: audioPlayer.readyState
            });
        } else if (error?.name === "NotAllowedError") {
            message = "The browser did not allow playback. Press Play again.";
        } else {
            message = error?.message || error?.name || "Unknown playback error.";
            console.error("Playback failed", error);
        }

        dockStatus.textContent = message;
        btnPlay.textContent = "Play";
    }

    audioPlayer.addEventListener("error", () => showPlaybackError());

    function renderPlaylist() {
        trackTbody.innerHTML = "";

        playlist.forEach((track, index) => {
            const tr = document.createElement("tr");
            tr.className = "track-row";
            tr.id = `track-${index}`;

            const numberCell = document.createElement("td");
            numberCell.style.color = "#b3b3b3";
            numberCell.textContent = String(index + 1);

            const titleCell = document.createElement("td");
            titleCell.className = "track-title-cell";
            titleCell.textContent = track.title;

            tr.append(numberCell, titleCell);
            tr.addEventListener("click", () => loadAndPlay(index));
            trackTbody.appendChild(tr);
        });
    }

    async function loadAndPlay(index) {
        if (index < 0 || index >= playlist.length) return;

        if (currentIndex !== -1) {
            document
                .getElementById(`track-${currentIndex}`)
                ?.querySelector(".track-title-cell")
                ?.classList.remove("playing-text");
        }

        currentIndex = index;
        const currentTrack = playlist[currentIndex];
        const currentRow = document.getElementById(`track-${currentIndex}`);
        currentRow?.querySelector(".track-title-cell")?.classList.add("playing-text");

        dockTitle.textContent = currentTrack.title;
        dockStatus.textContent = "Loading audio…";
        btnPlay.textContent = "Play";

        audioPlayer.pause();
        audioPlayer.src = currentTrack.url;
        audioPlayer.load();

        console.info("Trying audio URL:", currentTrack.url);

        try {
            await audioPlayer.play();
            dockStatus.textContent = "Playing";
            btnPlay.textContent = "Pause";
        } catch (error) {
            showPlaybackError(error);
        }
    }

    btnShuffle.addEventListener("click", () => {
        isShuffle = !isShuffle;
        btnShuffle.style.color = isShuffle ? "var(--accent)" : "var(--text-main)";
    });

    btnPlay.addEventListener("click", async () => {
        if (currentIndex === -1) {
            await loadAndPlay(0);
            return;
        }

        if (audioPlayer.paused) {
            try {
                await audioPlayer.play();
                dockStatus.textContent = "Playing";
                btnPlay.textContent = "Pause";
            } catch (error) {
                showPlaybackError(error);
            }
        } else {
            audioPlayer.pause();
            dockStatus.textContent = "Paused";
            btnPlay.textContent = "Play";
        }
    });

    btnNext.addEventListener("click", () => {
        if (isShuffle && playlist.length > 1) {
            let nextIndex;
            do {
                nextIndex = Math.floor(Math.random() * playlist.length);
            } while (nextIndex === currentIndex);
            loadAndPlay(nextIndex);
        } else {
            loadAndPlay(currentIndex < playlist.length - 1 ? currentIndex + 1 : 0);
        }
    });

    btnPrev.addEventListener("click", () => {
        if (currentIndex > 0) loadAndPlay(currentIndex - 1);
    });

    audioPlayer.addEventListener("ended", () => btnNext.click());

    renderPlaylist();
</script>
</body>
</html>
